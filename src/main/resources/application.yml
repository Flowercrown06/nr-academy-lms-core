spring:
  application:
    name: nr-academy

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:servicedb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:test}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8082}

jwt:
  secret-key: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:1800000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

aws:
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  default-region: ${AWS_DEFAULT_REGION:eu-north-1}
  bucket-name: ${AWS_BUCKET_NAME:}

file:
  image:
    max-size: 3145728
  cv:
    max-size: 10485760

logging:
  level:
    com.zaxxer.hikari.pool.HikariPool: ERROR
    
threshold:
  minutes: ${THRESHOLD_MINUTES:3}

app:
  mail:
    from: no-reply@example.com
    contact-inbox: support@example.com
  public-url: http://localhost:8082
